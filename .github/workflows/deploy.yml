name: Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-out
          path: out/
          retention-days: 1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-2

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: nextjs-out
          path: out/

      - name: Deploy to S3
        run: |
          set +e
          BUCKET=$(aws s3api list-buckets \
            --query "Buckets[?starts_with(Name, 'zachtech.dev')].Name" \
            --output text | head -n1)

          if [ -z "$BUCKET" ]; then
            echo "Deploy failed: S3 bucket not found"
            exit 1
          fi

          aws s3 sync out/ "s3://${BUCKET}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.json" \
            --exclude "opengraph-image" \
            > /tmp/deploy.log 2>&1
          sync_exit=$?

          if [ "$sync_exit" -ne 0 ]; then
            echo "Deploy failed: S3 sync (assets)"
            exit 1
          fi

          aws s3 sync out/ "s3://${BUCKET}/" \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "*.json" \
            --content-type "text/html" \
            >> /tmp/deploy.log 2>&1
          sync_exit=$?

          if [ "$sync_exit" -ne 0 ]; then
            echo "Deploy failed: S3 sync (html)"
            exit 1
          fi

          if [ -f out/opengraph-image ]; then
            aws s3 cp out/opengraph-image "s3://${BUCKET}/opengraph-image" \
              --content-type "image/png" \
              --cache-control "public, max-age=31536000, immutable" \
              >> /tmp/deploy.log 2>&1
            if [ $? -ne 0 ]; then
              echo "Deploy failed: opengraph-image upload"
              exit 1
            fi
          fi

          echo "Deploy to S3 succeeded"

      - name: Invalidate CloudFront cache
        run: |
          set +e
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items, 'zachtech.dev')].Id" \
            --output text | head -n1)

          if [ -z "$DISTRIBUTION_ID" ]; then
            echo "Deploy failed: CloudFront distribution not found"
            exit 1
          fi

          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            > /tmp/deploy.log 2>&1
          invalidation_exit=$?
          set -e

          if [ "$invalidation_exit" -ne 0 ]; then
            echo "Deploy failed: CloudFront invalidation"
            exit 1
          fi

          echo "CloudFront cache invalidation succeeded"
