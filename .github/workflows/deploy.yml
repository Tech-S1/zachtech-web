name: Deploy Next.js to S3

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Find S3 bucket
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: find-bucket
        run: |
          BUCKET=$(aws s3api list-buckets \
            --query "Buckets[?starts_with(Name, 'zachtech.dev')].Name" \
            --output text | head -n1)
          echo "bucket_name=$BUCKET" >> $GITHUB_OUTPUT
          echo "Found S3 bucket: $BUCKET"

      - name: Deploy to S3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          BUCKET=${{ steps.find-bucket.outputs.bucket_name }}

          aws s3 sync out/ s3://$BUCKET/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.json" \
            --exclude "opengraph-image"

          aws s3 sync out/ s3://$BUCKET/ \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "*.json" \
            --content-type "text/html"

          if [ -f out/opengraph-image ]; then
            aws s3 cp out/opengraph-image s3://$BUCKET/opengraph-image \
              --content-type "image/png" \
              --cache-control "public, max-age=31536000, immutable"
          fi

      - name: Invalidate CloudFront cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items, 'zachtech.dev')].Id" \
            --output text | head -n1)
          
          if [ ! -z "$DISTRIBUTION_ID" ]; then
            echo "Found CloudFront distribution: $DISTRIBUTION_ID"
            aws cloudfront create-invalidation \
              --distribution-id $DISTRIBUTION_ID \
              --paths "/*"
            echo "CloudFront cache invalidated"
          else
            echo "No CloudFront distribution found for zachtech.dev"
          fi

